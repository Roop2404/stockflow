services:
  db:
    image: postgres:17
    container_name: stockflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stockflow_db
      POSTGRES_USER: stockflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stockflow_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - stockflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockflow -d stockflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  stockflow_postgres_data:
